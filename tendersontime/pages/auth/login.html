<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Defence Tenders</title>
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/auth.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  </head>
  <body class="auth-body">
    <div id="navbar"></div>
    <main>
        <section class="login">
            <div class="login-container">
                <div class="login-card">
                    <div class="firstclass">
                    <span>Sign in</span>
                    <a href="../../index.html"><span class="material-symbols-outlined">
                        close_small
                    </span></a>
                </div>
                <div class="secondclass">
                    <div class="email">
                        <input type="email" placeholder="Email address">
                    </div>
                    <div class="pass">
                        <input type="password" placeholder="Password">
                    </div>
                    <div class="forgot">
                    
                        <label class="checkbox-wrapper">
                            <input type="checkbox">
                    
                            <span class="custom-checkbox">
                                <span class="material-symbols-outlined">
                                    check
                                </span>
                            </span>
                    
                            <span>Keep me signed in</span>
                        </label>
                    
                        <span class="pass">
                            Forgot password?
                        </span>
                    
                    </div>
                    </div>
                <div class="thirdclass">
                    <button>
                        <a href="../../index.html">Sign in <span class="material-symbols-outlined">
                                arrow_forward
                            </span></a>
                    </button>
                </div>
                <div class="fourthclass">
                    <div class="forthclass-up">
                        <span class="line"></span>
                        <span>Or sign in with</span>
                        <span class="line"></span>
                    </div>
                    <div class="forthclass-down">
                        <span>Google</span>
                        <span>Apple</span>
                        <span>Facebook</span>
                    </div>
                </div>
                <div class="fifthclass">
                    New to defencetenders?
                    <a href="../auth/signup.html">Sign up</a>
                </div>
                <div class="sixthclass">
                    By continuing you accept our terms of use and privacy policy.
                </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>
    <script src="../../js/components.js"></script>
  </body>
</html>
