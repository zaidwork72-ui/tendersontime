<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Ready | Defence Tenders</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/auth.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  </head>
  <body class="auth-body">
    <div id="navbar"></div>

    <main class="auth-shell">
      <section class="auth-success">
        <div class="success-rocket">🚀</div>
        <h1>Your account is ready</h1>
        <p>Let's personalize your experience to show defence tenders that matter to you.</p>

        <div class="auth-success-actions">
          <button type="button" class="primary-btn" onclick="window.location.href='preferences.html'">Personalize experience</button>
          <button type="button" class="ghost-btn" onclick="window.location.href='../../index.html'">Skip for now</button>
        </div>

        <div class="auth-success-note">You can update these preferences anytime from your profile.</div>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </section>
    </main>

    <script src="../../js/components.js"></script>
  </body>
</html>
